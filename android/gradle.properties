# Gradle properties for the Android build
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Forward Ninja's build output ("[n/N] Building CXX object .../File.cpp.o") to the console
# Comma-separated: build_stdout, configure_stdout, clean_stdout, prefab_stdout, verbose
android.native.buildOutput=build_stdout

# Use the new resource-shrinking pipeline
android.useAndroidX=true
android.enableJetifier=true
android.prefabVersion=2.0.0